<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pouchline Age Gate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: one centred column. Pouchline brand guidelines (June 2025): Figtree headings, Inter body,
     Rich Black #021D2E, Lawn Green #90FF5C, Alice Blue #E9F2F4, Tiffany Blue #B8E8D7, Verdigris #12B6B5. */
  :root {
    --bg: #e9f2f4;          /* Alice Blue */
    --fg: #021d2e;          /* Rich Black */
    --muted: #4a5a66;
    --track: #ffffff;
    --track-line: #b8e8d7;  /* Tiffany Blue */
    --knob: #021d2e;
    --knob-fg: #90ff5c;
    --accent: #90ff5c;      /* Lawn Green */
    --accent-ink: #021d2e;
    --line: #b8e8d7;
    --mark-bg: #021d2e;
    --mark-stroke: transparent;
    --heading: "Figtree", "Segoe UI", Arial, sans-serif;
    --body: "Inter", "Segoe UI", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #021d2e; --fg: #ffffff; --muted: #b8c4cc; --track: #0b2a3d; --track-line: #164257;
      --knob: #90ff5c; --knob-fg: #021d2e; --accent: #90ff5c; --accent-ink: #021d2e; --line: #164257;
      --mark-bg: transparent; --mark-stroke: #90ff5c; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #021d2e; --fg: #ffffff; --muted: #b8c4cc; --track: #0b2a3d; --track-line: #164257;
    --knob: #90ff5c; --knob-fg: #021d2e; --accent: #90ff5c; --accent-ink: #021d2e; --line: #164257;
    --mark-bg: transparent; --mark-stroke: #90ff5c; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
    display: flex; flex-direction: column; align-items: center;
    padding-block: 32px 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 440px; gap: 28px; text-align: center; }

  .logo { width: min(260px, 70vw); height: auto; display: block; }
  .logo .mark-bg { fill: var(--mark-bg); stroke: var(--mark-stroke); stroke-width: 14; }
  .logo .mark-fg { fill: var(--accent); }
  .logo .wordmark path { fill: var(--fg); }

  h1 { font-family: var(--heading); font-weight: 600; font-size: clamp(36px, 9vw, 48px); line-height: 1.05; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 16px; line-height: 1.5; margin: -10px 0 0; max-width: 34ch; }

  .slider { width: 100%; }
  .track {
    position: relative; height: 64px; border-radius: 999px; background: var(--track);
    border: 1px solid var(--track-line); box-sizing: border-box;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: pan-y;
  }
  .track:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 64px; background: var(--accent); opacity: 0.35; border-radius: 999px; }
  .label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--heading); font-weight: 600; font-size: 17px; letter-spacing: 0.02em;
    color: var(--muted); padding-left: 56px; pointer-events: none;
  }
  .knob {
    position: absolute; top: 3px; left: 3px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--knob); color: var(--knob-fg); display: grid; place-items: center;
    cursor: grab; box-shadow: 0 4px 14px rgba(2,29,46,0.25);
  }
  .knob:active { cursor: grabbing; }
  .knob svg { width: 24px; height: 24px; }
  .track.done .fill { opacity: 1; }
  .track.done .label { color: var(--accent-ink); }
  @media (prefers-reduced-motion: no-preference) {
    .track:not(.dragging) .knob, .track:not(.dragging) .fill { transition: left 0.25s ease, width 0.25s ease; }
    .label { animation: shimmer 2.4s ease-in-out infinite; }
    @keyframes shimmer { 0%,100% { opacity: 0.7 } 50% { opacity: 1 } }
  }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }

  .decline { color: var(--fg); font-weight: 500; font-size: 15px; text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .decline:hover { border-color: var(--fg); }

  footer { width: 100%; max-width: 560px; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.5; text-align: center; }
  footer a { color: var(--muted); }
</style>

</head>

  <h1>Are you 18 or over?</h1>
  <p class="sub">You need to be 18 or over to shop with Pouchline.</p>

  <div class="slider">
    <div class="track" id="track" role="slider" tabindex="0" aria-label="Slide to confirm you are 18 or over" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill" id="fill"></div>
      <div class="label" id="label">Slide to enter</div>
      <div class="knob" id="knob" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
    <p class="hint">Drag the handle all the way to the right</p>
  </div>

  <a class="decline" id="decline" href="https://www.google.com/">No, I'm under 18</a>
</main>

<footer>
  &copy; Pouchline &middot; <a href="https://pouchline.com/policies/privacy-policy">Privacy policy</a>
</footer>

<script>
(function () {
  // ===== Settings: change these three lines if needed =====
  var STORE_URL = "https://pouchline.com/";        // where the slider sends people
  var DECLINE_URL = "https://www.google.com/";      // where "No, I'm under 18" goes
  var REMEMBER_DAYS = 30;                           // skip the gate for returning visitors (0 = always ask)
  // =========================================================

  var track = document.getElementById("track");
  var knob = document.getElementById("knob");
  var fill = document.getElementById("fill");
  var label = document.getElementById("label");
  document.getElementById("decline").href = DECLINE_URL;

  // Keep ad tracking tags (utm_source etc.) when forwarding to the store.
  function destination() {
    var q = window.location.search;
    if (!q || q.length < 2) return STORE_URL;
    return STORE_URL + (STORE_URL.indexOf("?") === -1 ? q : "&" + q.slice(1));
  }

  function remembered() {
    try {
      var until = parseInt(localStorage.getItem("pouchline-age-ok-until") || "0", 10);
      return until > Date.now();
    } catch (e) { return false; }
  }
  function remember() {
    if (REMEMBER_DAYS <= 0) return;
    try { localStorage.setItem("pouchline-age-ok-until", String(Date.now() + REMEMBER_DAYS * 864e5)); } catch (e) {}
  }

  if (remembered()) { window.location.replace(destination()); return; }

  var dragging = false, startX = 0, pos = 0, done = false;
  function maxPos() { return track.clientWidth - knob.offsetWidth - 8; }
  function render() {
    knob.style.left = (3 + pos) + "px";
    fill.style.width = (pos + 64) + "px";
    track.setAttribute("aria-valuenow", String(Math.round(100 * pos / maxPos())));
  }
  function finish() {
    if (done) return;
    done = true;
    pos = maxPos(); render();
    track.classList.add("done");
    label.textContent = "Welcome";
    remember();
    setTimeout(function () { window.location.href = destination(); }, 350);
  }
  function reset() { pos = 0; render(); }

  function onDown(e) {
    if (done) return;
    dragging = true; track.classList.add("dragging");
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - pos;
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging || done) return;
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    pos = Math.max(0, Math.min(maxPos(), x));
    render();
    if (pos >= maxPos() - 2) { dragging = false; track.classList.remove("dragging"); finish(); }
  }
  function onUp() {
    if (!dragging) return;
    dragging = false; track.classList.remove("dragging");
    if (!done) reset();
  }
  knob.addEventListener("mousedown", onDown);
  knob.addEventListener("touchstart", onDown, { passive: false });
  window.addEventListener("mousemove", onMove);
  window.addEventListener("touchmove", onMove, { passive: true });
  window.addEventListener("mouseup", onUp);
  window.addEventListener("touchend", onUp);
  window.addEventListener("touchcancel", onUp);

  // Keyboard: arrow right nudges, End or Enter completes.
  track.addEventListener("keydown", function (e) {
    if (done) return;
    if (e.key === "ArrowRight") { pos = Math.min(maxPos(), pos + maxPos() / 8); render(); if (pos >= maxPos()) finish(); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { pos = Math.max(0, pos - maxPos() / 8); render(); e.preventDefault(); }
    else if (e.key === "End" || e.key === "Enter" || e.key === " ") { finish(); e.preventDefault(); }
    else if (e.key === "Home") { reset(); e.preventDefault(); }
  });
  window.addEventListener("resize", function () { if (!done) reset(); });
  render();
})();
</script>
</body>
</html>
